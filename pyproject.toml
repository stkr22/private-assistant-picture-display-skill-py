[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[project]
name = "private-assistant-picture-display-skill"
version = "0.14.0"
description = "Voice-controlled picture display skill for Inky e-ink devices."
authors = [
    { name = "stkr22", email = "stkr22@github.com" }
]
readme = "README.md"
license = "GPL-3.0-only"
license-files = [
    "LICENSE",
]

keywords = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.12,<3.14"
dependencies = [
    "private-assistant-commons~=6.3.0",
    "jinja2~=3.1.6",
    "typer~=0.24.1",
    "httpx~=0.28.1",
    "pydantic~=2.12.5",
    "pydantic-settings~=2.13.1",
    "pyyaml~=6.0.3",
]

[project.scripts]
private-assistant-picture-display-skill = "private_assistant_picture_display_skill.main:app"

[project.urls]
Homepage = "https://github.com/stkr22/private-assistant-picture-display-skill"
Repository = "https://github.com/stkr22/private-assistant-picture-display-skill"
Issues = "https://github.com/stkr22/private-assistant-picture-display-skill/issues"
Changelog = "https://github.com/stkr22/private-assistant-picture-display-skill/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff~=0.15.10",
    "ty~=0.0.31",
    "pytest~=9.0.3",
    "pytest-cov~=7.1.0",
    "pytest-asyncio~=1.3.0",
]

[tool.ty.rules]
possibly-unresolved-reference = "warn"
unused-ignore-comment = "warn"
